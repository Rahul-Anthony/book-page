<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Book</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Quicksand:wght@400;600&display=swap');
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #16213e 40%, #1a1a3e 70%, #0f0f1e 100%);
      font-family: 'Quicksand', Arial, sans-serif;
      color: #e0d5ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated stars background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    /* Animated moving lines background */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(90deg, transparent 0%, rgba(138, 43, 226, 0.15) 50%, transparent 100%),
        linear-gradient(90deg, transparent 0%, rgba(75, 0, 130, 0.1) 50%, transparent 100%),
        linear-gradient(90deg, transparent 0%, rgba(138, 43, 226, 0.12) 50%, transparent 100%),
        linear-gradient(90deg, transparent 0%, rgba(75, 0, 130, 0.08) 50%, transparent 100%);
      background-size: 200% 25%, 200% 25%, 200% 25%, 200% 25%;
      background-position: 
        0% 0%, 0% 25%, 0% 50%, 0% 75%;
      animation: 
        moveLines1 15s linear infinite,
        moveLines2 20s linear infinite reverse,
        moveLines3 18s linear infinite,
        moveLines4 22s linear infinite reverse;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    @keyframes moveLines1 {
      0% { background-position: 0% 0%, 0% 25%, 0% 50%, 0% 75%; }
      100% { background-position: 200% 0%, 0% 25%, 0% 50%, 0% 75%; }
    }

    @keyframes moveLines2 {
      0% { background-position: 0% 0%, 200% 25%, 0% 50%, 0% 75%; }
      100% { background-position: 0% 0%, -200% 25%, 0% 50%, 0% 75%; }
    }

    @keyframes moveLines3 {
      0% { background-position: 0% 0%, 0% 25%, 0% 50%, 0% 75%; }
      100% { background-position: 0% 0%, 0% 25%, 200% 50%, 0% 75%; }
    }

    @keyframes moveLines4 {
      0% { background-position: 0% 0%, 0% 25%, 0% 50%, 200% 75%; }
      100% { background-position: 0% 0%, 0% 25%, 0% 50%, -200% 75%; }
    }

    .container {
      background: rgba(20, 25, 50, 0.85);
      margin: clamp(10px, 5vw, 36px) 0;
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 
                  0 0 80px rgba(75, 0, 130, 0.2);
      max-width: 830px;
      width: clamp(300px, 95vw, 830px);
      padding: clamp(20px, 5vw, 34px);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid rgba(138, 43, 226, 0.6);
      position: relative;
      z-index: 1;
    }

    /* 3D flip container */
    .flip-container {
      perspective: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flipper {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .flipper.flipped {
      transform: rotateY(180deg);
    }

    .cover-section, .pdf-section {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cover-section {
      transform: rotateY(0deg);
    }

    .pdf-section {
      transform: rotateY(180deg);
    }

    .cover-img {
      display: block;
      width: clamp(150px, 60vw, 280px);
      height: auto;
      object-fit: cover;
      border-radius: 17px;
      margin-bottom: clamp(15px, 4vw, 22px);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.5),
                  0 0 60px rgba(75, 0, 130, 0.3);
      border: 2.5px solid rgba(138, 43, 226, 0.8);
      transition: transform 0.3s ease;
    }

    .cover-img:hover {
      transform: scale(1.05);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: clamp(1.6em, 5vw, 2.7em);
      margin: clamp(10px, 3vw, 15px) 0 clamp(5px, 2vw, 8px) 0;
      letter-spacing: 0.7px;
      text-shadow: 0px 0px 20px rgba(212, 175, 55, 0.6),
                   0px 0px 40px rgba(138, 43, 226, 0.4);
      line-height: 1.2;
    }

    h2 {
      font-size: clamp(1em, 3vw, 1.25em);
      color: #b19cd9;
      letter-spacing: 1.2px;
      margin: 0 0 clamp(12px, 3vw, 17px) 0;
      font-weight: 600;
      text-shadow: 0px 0px 10px rgba(177, 156, 217, 0.5);
    }

    .pdf-section h1 {
      font-size: clamp(1.4em, 4vw, 2em);
      margin-bottom: clamp(3px, 2vw, 5px);
    }

    .pdf-section h2 {
      font-size: clamp(0.9em, 2.5vw, 1.05em);
      margin-bottom: clamp(10px, 3vw, 15px);
    }

    .heart {
      color: #8a2be2;
      font-size: 1.5em;
      margin: 0 7px 4px 2px;
      vertical-align: middle;
      animation: heartbeat 1.4s infinite;
      text-shadow: 0px 0px 10px rgba(138, 43, 226, 0.6);
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.16); }
      50% { transform: scale(1.13); }
      60% { transform: scale(1.19); }
    }

    .read-btn, .back-btn {
      margin-top: clamp(15px, 4vw, 24px);
      padding: clamp(10px, 3vw, 14px) clamp(30px, 6vw, 45px);
      font-size: clamp(0.9em, 2.5vw, 1.1em);
      font-weight: 600;
      color: #ffffff;
      border: 2px solid #d4af37;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      touch-action: manipulation;
    }

    .read-btn {
      background: linear-gradient(135deg, #8a2be2 0%, #4b0082 50%, #1a0033 100%);
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.6),
                  inset 0 0 20px rgba(212, 175, 55, 0.1);
    }

    .read-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.8),
                  0 8px 16px rgba(0, 0, 0, 0.4),
                  inset 0 0 20px rgba(212, 175, 55, 0.2);
      background: linear-gradient(135deg, #a020f0 0%, #5d1a8f 50%, #2d0052 100%);
    }

    .read-btn:active {
      transform: translateY(-1px);
    }

    .back-btn {
      background: linear-gradient(135deg, #4b0082 0%, #1a0033 100%);
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.7),
                  0 6px 12px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #5d1a8f 0%, #2d0052 100%);
    }

    /* PDF Viewer Container */
    .pdf-viewer-container {
      margin-top: clamp(12px, 3vw, 16px);
      width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.5),
                  0 0 60px rgba(75, 0, 130, 0.3);
      border: 2.5px solid rgba(138, 43, 226, 0.8);
      background: #0a0e27;
      overflow: hidden;
    }

    .pdf-viewer {
      width: 100%;
      height: clamp(400px, 80vh, 70vh);
      border: none;
      border-radius: 12px;
    }

    /* Fallback message for unsupported browsers */
    .pdf-fallback {
      padding: clamp(20px, 5vw, 30px);
      text-align: center;
      color: #b19cd9;
    }

    .pdf-fallback a {
      color: #d4af37;
      text-decoration: none;
      border-bottom: 2px solid #d4af37;
      transition: color 0.3s;
    }

    .pdf-fallback a:hover {
      color: #e0d5ff;
    }

    .footer {
      text-align: center;
      margin-top: clamp(15px, 4vw, 22px);
      color: #b19cd9;
      font-size: clamp(0.95em, 2.5vw, 1.05em);
      text-shadow: 0px 0px 10px rgba(177, 156, 217, 0.4);
    }

    /* Mobile-specific optimizations */
    @media (max-width: 600px) {
      body {
        align-items: center;
      }

      .container {
        margin: 10px auto;
        width: 95vw;
      }

      .heart {
        font-size: 1.2em;
      }

      .pdf-viewer {
        height: 60vh;
      }

      /* Disable hover effects on touch devices */
      @media (hover: none) {
        .read-btn:hover,
        .back-btn:hover,
        .cover-img:hover {
          transform: none;
        }
      }
    }

    /* Landscape mode adjustments */
    @media (max-height: 600px) and (orientation: landscape) {
      .pdf-viewer {
        height: 75vh;
      }

      .container {
        margin: 5px 0;
      }
    }

    /* Large desktop */
    @media (min-width: 1024px) {
      .read-btn:hover,
      .back-btn:hover {
        box-shadow: 0 0 40px rgba(138, 43, 226, 0.8),
                    0 8px 16px rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Flip Container -->
    <div class="flip-container">
      <div class="flipper" id="flipper">
        
        <!-- Cover Section (Front) -->
        <div class="cover-section">
          <h1>
            <span class="heart">♡</span>
            Welcome to world of words!
            <span class="heart">♡</span>
          </h1>
          <h2>By : Ihshana</h2>
          <img src="a_professional_kindle_book_cover_titled_silent_strength_with_the_subtitle_poems.png" alt="Book Cover" class="cover-img">
          <button class="read-btn" onclick="flipBook()" aria-label="Read the book">Read</button>
        </div>

        <!-- PDF Section (Back) -->
        <div class="pdf-section">
          <h1>
            <span class="heart">♡</span>
            Welcome to world of words!
            <span class="heart">♡</span>
          </h1>
          <h2>By : Ihshana</h2>
          <div class="pdf-viewer-container">
            <iframe src="SilentStrength_Designed.pdf" class="pdf-viewer" title="Book PDF Viewer"></iframe>
            <noscript>
              <div class="pdf-fallback">
                <p>Your browser doesn't support embedded PDFs.</p>
                <a href="SilentStrength_Designed.pdf" target="_blank">Click here to open the PDF</a>
              </div>
            </noscript>
          </div>
          <button class="back-btn" onclick="flipBook()" aria-label="Back to cover">← Back to Cover</button>
        </div>

      </div>
    </div>

    <div class="footer">
      Made with <span style="color:#8a2be2;">♥</span> especially for readers who dream big!
    </div>
  </div>

  <script>
    function flipBook() {
      const flipper = document.getElementById('flipper');
      flipper.classList.toggle('flipped');
    }

    // Prevent accidental double-tap zoom on buttons
    document.addEventListener('touchend', function(event) {
      if (event.target.classList.contains('read-btn') || event.target.classList.contains('back-btn')) {
        event.preventDefault();
        event.target.click();
      }
    }, false);
  </script>
</body>
</html>
