<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Book</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Quicksand:wght@400;600&display=swap');
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0e27 0%, #16213e 40%, #1a1a3e 70%, #0f0f1e 100%);
      font-family: 'Quicksand', Arial, sans-serif;
      color: #e0d5ff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated stars background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .container {
      background: rgba(20, 25, 50, 0.85);
      margin: 36px 0;
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.4), 
                  0 0 80px rgba(75, 0, 130, 0.2);
      max-width: 830px;
      width: 95%;
      padding: 34px 30px 25px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid rgba(138, 43, 226, 0.6);
      position: relative;
      z-index: 1;
    }

    .cover-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 1;
      transition: opacity 0.8s ease-in-out;
      pointer-events: auto;
    }

    .cover-section.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .pdf-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      pointer-events: none;
    }

    .pdf-section.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .cover-img {
      display: block;
      width: 250px;
      max-width: 60vw;
      height: auto;
      object-fit: cover;
      border-radius: 17px;
      margin-bottom: 22px;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.5),
                  0 0 60px rgba(75, 0, 130, 0.3);
      border: 2.5px solid rgba(138, 43, 226, 0.8);
      transition: transform 0.3s ease;
    }

    .cover-img:hover {
      transform: scale(1.05);
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #d4af37;
      font-size: 2.7em;
      margin-bottom: 8px;
      letter-spacing: 0.7px;
      text-shadow: 0px 0px 20px rgba(212, 175, 55, 0.6),
                   0px 0px 40px rgba(138, 43, 226, 0.4);
    }

    h2 {
      font-size: 1.25em;
      color: #b19cd9;
      letter-spacing: 1.2px;
      margin: 0 0 17px 0;
      font-weight: 600;
      text-shadow: 0px 0px 10px rgba(177, 156, 217, 0.5);
    }

    .heart {
      color: #8a2be2;
      font-size: 1.5em;
      margin: 0 7px 4px 2px;
      vertical-align: middle;
      animation: heartbeat 1.4s infinite;
      text-shadow: 0px 0px 10px rgba(138, 43, 226, 0.6);
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.16); }
      50% { transform: scale(1.13); }
      60% { transform: scale(1.19); }
    }

    .read-btn {
      margin-top: 24px;
      padding: 14px 45px;
      font-size: 1.1em;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #8a2be2 0%, #4b0082 50%, #1a0033 100%);
      border: 2px solid #d4af37;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(138, 43, 226, 0.6),
                  inset 0 0 20px rgba(212, 175, 55, 0.1);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .read-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 40px rgba(138, 43, 226, 0.8),
                  0 8px 16px rgba(0, 0, 0, 0.4),
                  inset 0 0 20px rgba(212, 175, 55, 0.2);
      background: linear-gradient(135deg, #a020f0 0%, #5d1a8f 50%, #2d0052 100%);
    }

    .read-btn:active {
      transform: translateY(-1px);
    }

    .back-btn {
      margin-top: 20px;
      padding: 12px 35px;
      font-size: 1em;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #4b0082 0%, #1a0033 100%);
      border: 2px solid #d4af37;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.7),
                  0 6px 12px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, #5d1a8f 0%, #2d0052 100%);
    }

    .pdf-viewer {
      margin-top: 16px;
      width: 100%;
      min-height: 80vh;
      height: 78vh;
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.5),
                  0 0 60px rgba(75, 0, 130, 0.3);
      border: 2.5px solid rgba(138, 43, 226, 0.8);
      background: #0a0e27;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #b19cd9;
      font-size: 1.05em;
      text-shadow: 0px 0px 10px rgba(177, 156, 217, 0.4);
    }

    @media (max-width: 600px) {
      .container {
        padding: 13px 2vw 7vw 2vw;
        margin: 10px 0;
      }
      .cover-img {
        width: 150px;
        max-width: 90vw;
      }
      .pdf-viewer {
        min-height: 60vh;
        height: 52vh;
      }
      h1 { font-size: 1.4em; }
      .read-btn {
        padding: 12px 35px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Cover Section -->
    <div class="cover-section" id="coverSection">
      <h1>
        <span class="heart">♡</span>
        Welcome to world of words!
        <span class="heart">♡</span>
      </h1>
      <h2>By : Ihshana</h2>
      <img src="a_professional_kindle_book_cover_titled_silent_strength_with_the_subtitle_poems.png" alt="Book Cover" class="cover-img">
      <button class="read-btn" onclick="showBook()">Read</button>
    </div>

    <!-- PDF Section -->
    <div class="pdf-section" id="pdfSection">
      <embed src="SilentStrength_Designed.pdf" type="application/pdf" class="pdf-viewer">
      <button class="back-btn" onclick="showCover()">← Back to Cover</button>
    </div>

    <div class="footer">
      Made with <span style="color:#8a2be2;">♥</span> especially for readers who dream big!
    </div>
  </div>

  <script>
    function showBook() {
      document.getElementById('coverSection').classList.add('hidden');
      document.getElementById('pdfSection').classList.add('visible');
    }

    function showCover() {
      document.getElementById('coverSection').classList.remove('hidden');
      document.getElementById('pdfSection').classList.remove('visible');
    }
  </script>
</body>
</html>
